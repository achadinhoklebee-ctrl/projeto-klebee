name: Validate Klebee video engine

on:
  pull_request:
    branches: [main]
  push:
    branches: [novo-motor-audiovisual-klebee]

jobs:
  python-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile main.py
      - name: Validate dependency file
        run: python -m pip install --dry-run -r requirements.txt
      - name: Build Docker image
        run: docker build -t klebee-video-engine:test .
